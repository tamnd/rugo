name: deep

# The checks that cannot finish in the three minutes ci.yml is held to.
# Miri under both borrow models, loom on the shard lock, the fuzzers, the release test matrix, the benchmark smoke run and a cold build from source with no cache and no toolchain file.
#
# This repository needs these more than its siblings do.
# A Swiss table probes sixteen slots at a time under NEON or SSE2 and a slab arena addresses its entries by a four byte offset with no allocator header, so an index computed one slot wide is a read of somebody else's bytes rather than a panic.
# The lints in `Cargo.toml` deny undocumented unsafe rather than unsafe itself, and the honest answer to that policy is this file.
#
# They run nightly, on demand against any ref, and on a pull request carrying the `deep` label.
# A milestone pull request should carry that label, because a milestone is when the entry encoding, the unsafe blocks and the benchmarks all move at once.
# An ordinary patch does not need it.
#
# Reproducing a Miri shard locally is one shard at a time:
#
#     MIRIFLAGS="-Zmiri-strict-provenance -Zmiri-disable-isolation" \
#       cargo +nightly miri nextest run --locked -p rugo-map --test-threads 4
#
# One at a time and not the whole matrix at once.
# Miri holds the interpreted program's whole heap, and several of them side by side will take every gigabyte a laptop has and start swapping, which looks like a hang and is one.

on:
  schedule:
    # 03:00 UTC, which is the quiet end of the runner queue.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or sha to run against
        required: false
        default: main
  pull_request:
    types: [opened, synchronize, reopened, labeled]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

permissions:
  contents: read

concurrency:
  group: deep-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request only gets these if somebody asked for them.
  # Everything else that triggers this workflow runs the lot.
  wanted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.decide.outputs.run }}
      ref: ${{ steps.pick.outputs.ref }}
      shards: ${{ steps.shards.outputs.list }}
      borrows: ${{ steps.decide.outputs.borrows }}
    steps:
      # A pull request is checked out at its head and not at `refs/pull/N/merge`.
      # The merge ref stops existing the moment the pull request is merged, and merging as soon as the local checks are green means this workflow is often still queued when that happens, so the run fails in checkout with `couldn't find remote ref` and tells nobody anything about the code.
      # The head ref is permanent.
      - id: pick
        env:
          INPUT: ${{ github.event.inputs.ref }}
          NUMBER: ${{ github.event.pull_request.number }}
          REF: ${{ github.ref }}
        run: |
          set -u
          if [ -n "$INPUT" ]; then
            echo "ref=$INPUT" >> "$GITHUB_OUTPUT"
          elif [ -n "$NUMBER" ]; then
            echo "ref=refs/pull/$NUMBER/head" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.pick.outputs.ref }}
          # Deep enough to diff a pull request against its base and against the commit the last run already covered.
          fetch-depth: 0
      # Whether to run at all, and how much Miri to run when we do.
      #
      # Tree borrows is stricter about aliasing than stacked borrows and catches a different class of mistake, so both are worth running and the nightly run runs both.
      # A pull request gets stacked only: it is the model the unsafe code was written against, tree disagrees with it rarely, and when it does the nightly run says so the same day rather than the same minute.
      #
      # A push that only moves prose does not need any of this.
      # That is not a nicety: a changelog line on a pull request that already ran deep costs several minutes and tells nobody anything.
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'deep') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -u
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo 'borrows=["stacked","tree"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'borrows=["stacked"]' >> "$GITHUB_OUTPUT"
          if [ "$LABELLED" != "true" ]; then
            echo "no deep label, skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `prose_only <sha>` is true when nothing but markdown has changed since that commit.
          # An unknown or unrelated commit, which is what a force push leaves behind, is not an answer, so it runs.
          prose_only() {
            git cat-file -e "$1^{commit}" 2>/dev/null || return 1
            changed=$(git diff --name-only "$1" HEAD)
            [ -n "$changed" ] || return 1
            ! printf '%s\n' "$changed" | grep -qv '\.md$'
          }
          if prose_only "$BASE"; then
            echo "the whole pull request is prose, skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$ACTION" = "synchronize" ] && prose_only "$BEFORE"; then
            echo "this push is prose on top of a run that already happened, skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      # The Miri matrix is one job per crate, and the list comes from the manifest rather than from a copy of it kept in this file.
      # A crate added next month gets interpreted without anybody remembering to come back here, which is the only way a list like this stays true.
      - id: shards
        run: |
          rm rust-toolchain.toml
          echo "list=$(cargo metadata --no-deps --format-version 1 | jq -c '
            [ .packages[] | select(.name != "xtask") | .name ] | sort')" >> "$GITHUB_OUTPUT"
      - run: echo "deep checks requested for ${{ github.event.inputs.ref || github.ref }}"

  # Every unsafe block in the workspace, interpreted.
  #
  # This is the job that decides whether the memory story is true.
  # The arena hands out `u32` offsets into a `Vec<u8>` and the table reads an entry header out of the middle of it, so a length computed wrongly reads bytes that belong to the next entry and returns them as a value.
  # Miri is the only thing here that catches that when the bytes it read happened to look right.
  #
  # `cargo miri test --workspace` walks the crates one after another, so the wait is the sum of all of them.
  # One job per crate makes the wait the slowest single crate instead.
  # Run through nextest rather than the built in harness, because Miri interprets threads on a single core and libtest's threads buy nothing, while nextest runs each test as its own process and uses the cores the runner has.
  #
  # nextest does not run doctests. They still run in `ci.yml` on every push, so what is lost is the doctests being interpreted, not the doctests.
  miri:
    needs: wanted
    if: needs.wanted.outputs.run == 'true'
    name: miri (${{ matrix.borrows }}, ${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One shard failing is a real finding and every other shard's result is still worth having, so a failure does not cancel its siblings.
      fail-fast: false
      matrix:
        borrows: ${{ fromJSON(needs.wanted.outputs.borrows) }}
        crate: ${{ fromJSON(needs.wanted.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.wanted.outputs.ref }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: taiki-e/install-action@v2.87.3
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          # Every shard builds a different subset of the tree with the same nightly, so without a key of its own they would race for one cache entry and each keep evicting the others'.
          key: ${{ matrix.borrows }}-${{ matrix.crate }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rm rust-toolchain.toml
      # Pinned to four rather than left to follow the core count, so that a bigger runner cannot quietly turn this into sixteen interpreters and an out of memory kill that reads like a hang.
      #
      # Isolation is disabled because the map reads the clock for every TTL and Miri's isolated clock does not move.
      # `rugo-server` and `rugo-net` open sockets, which Miri has no shim for, so their tests are the ones that will report unsupported operations rather than findings; that is worth knowing per crate rather than hidden behind a workspace run.
      - run: cargo miri nextest run --locked -p ${{ matrix.crate }} --test-threads 4
        env:
          MIRIFLAGS: >-
            ${{ matrix.borrows == 'tree'
              && '-Zmiri-tree-borrows -Zmiri-disable-isolation'
              || '-Zmiri-strict-provenance -Zmiri-disable-isolation' }}

  # A dozen shard names is more than a branch protection rule wants to know about. This is the one to require.
  miri-done:
    needs: [wanted, miri]
    if: always() && needs.wanted.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "miri: ${{ needs.miri.result }}"
          test "${{ needs.miri.result }}" = success

  # The shard lock, under every interleaving loom can think of.
  #
  # It is a spin lock built out of one `AtomicBool` and a `compare_exchange_weak`, and every read and every write in this server passes through one.
  # The ordering that makes it correct is two words in the source and cannot be tested by running it: a missing `Acquire` is a lock that works on x86 for years and then does not on a bench host with an ARM CPU.
  # Loom enumerates the interleavings instead of hoping to hit one.
  loom:
    needs: wanted
    if: needs.wanted.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.wanted.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: loom
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Quoted, because an unquoted `model::` puts a colon and a space in a plain scalar and YAML reads it as a mapping key, which is a parse error six lines from the cause.
      - run: "cargo test --locked --release -p rugo-map --lib model:: -- --nocapture"
        env:
          # The models live behind `#[cfg(loom)]`, so without this flag the job passes by running nothing.
          RUSTFLAGS: --cfg loom -D warnings
          # Three is where the interleavings stop being cheap and start being exhaustive enough to matter. The models are two threads deep, so this bounds them rather than describing them.
          LOOM_MAX_PREEMPTIONS: "3"

  # Fuzz targets are built and run briefly, so a target that stops compiling is caught the next morning rather than the next time somebody remembers to run the fuzzer.
  #
  # Sixty seconds finds a crash that a change introduced today; it does not find the one that has been there since M1.
  # For that the corpus has to live somewhere and the fuzzer has to run for hours, and neither belongs in a workflow file.
  fuzz:
    needs: wanted
    if: needs.wanted.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.wanted.outputs.ref }}
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2.87.3
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rm rust-toolchain.toml
      # The target is named rather than left to cargo-fuzz, which defaults it to the platform its own binary was built for.
      # install-action has no cargo-fuzz of its own and falls back to cargo-binstall, which fetches the musl build, so the default comes out as x86_64-unknown-linux-musl and the build dies on a missing musl std with a sanitizer error on top.
      # `rustc -vV` is the host this job is actually running on and is right whoever assembled the toolchain.
      # A block scalar rather than a plain one, because `host: ` inside the sed script is a colon and a space and YAML would read it as a mapping key.
      - id: host
        run: |
          echo "triple=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_OUTPUT"
      - run: cargo fuzz build --target ${{ steps.host.outputs.triple }}
      # All of them at once rather than one after another. They share nothing, and a runner has cores sitting idle through all but one of them.
      - name: sixty seconds per target, all of them at once
        run: |
          pids=""
          for t in $(cargo fuzz list); do
            cargo fuzz run --target ${{ steps.host.outputs.triple }} "$t" -- -max_total_time=60 -rss_limit_mb=2048 &
            pids="$pids $!"
          done
          rc=0
          for p in $pids; do wait "$p" || rc=1; done
          exit $rc
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  # The optimised build, on all three platforms.
  # A bug that only appears under optimisation is real and worth a job, it is just not worth one per commit.
  # It matters more here than in an ordinary crate: the release profile is fat link time optimisation with one codegen unit, and that is the profile every published number is measured under.
  test-release:
    needs: wanted
    if: needs.wanted.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            scope: --workspace
          - os: macos-latest
            scope: --workspace
          # The server is Unix, so Windows takes the portable crates, which is the same scope ci.yml gives it.
          - os: windows-latest
            scope: --workspace --exclude rugo --exclude rugo-net --exclude rugo-server
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.wanted.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo test ${{ matrix.scope }} --locked --release

  # The benchmarks have to keep compiling and keep running.
  # This measures nothing — a shared runner cannot — it runs one iteration of each so that a benchmark which panics or no longer builds is caught here rather than on the bench host at the start of a sweep that takes days.
  bench-smoke:
    needs: wanted
    if: needs.wanted.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.wanted.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      # Fat link time optimisation, one codegen unit and debug info are what the bench profile owes the numbers on a bench host.
      # This job produces no numbers, so it owes them nothing and pays several minutes for them.
      - run: cargo bench --workspace --locked -- --test
        env:
          CARGO_PROFILE_BENCH_LTO: "false"
          CARGO_PROFILE_BENCH_CODEGEN_UNITS: "16"
          CARGO_PROFILE_BENCH_DEBUG: "false"

  # Somebody with nothing but rustup should be able to clone and build.
  # No cache, no toolchain file, no repository specific setup.
  # This is the one job here that is deliberately slow, because a cache would defeat its point.
  from-source:
    needs: wanted
    if: needs.wanted.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.wanted.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --release --locked
      - run: cargo test --workspace --release --locked --no-fail-fast
